[project]
name = "ndltd-mcp"
version = "0.1.0"
description = "Local MCP server for the Taiwan thesis system (NDLTD): bibliographic search, abstracts and citations through your own browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp[cli]>=2.3.0,<3",
    "selectolax>=1.0.2,<2",
]

[project.scripts]
ndltd-mcp = "ndltd_mcp.stdio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndltd_mcp"]

[dependency-groups]
dev = [
    "bibtexparser>=1.4,<2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "rispy>=0.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
